<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Translation</title>
<style>
  /* ---- config knob: the heading shown above the captions ------------------ */
  :root{
    --bg:#0b0d10; --panel:#111418; --text:#f2f4f7; --dim:#9aa4b2;
    --live:#ffffff; --accent:#6ba7ff; --ok:#4caa5b; --bad:#d1584f;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#ffffff; --text:#14181d; --dim:#5b6572;
           --live:#0b0d10; --accent:#2f6fed; }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:var(--bg); color:var(--text);
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
        -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
        min-height:100dvh; }
  header{ flex:0 0 auto; display:flex; align-items:center; gap:.6rem;
          padding:.7rem 1rem; padding-top:calc(.7rem + env(safe-area-inset-top));
          border-bottom:1px solid rgba(128,128,128,.18); }
  header .name{ font-weight:700; font-size:1rem; letter-spacing:.01em; }
  header .dot{ width:9px; height:9px; border-radius:50%; background:var(--dim);
               transition:background .3s; }
  header .dot.on{ background:var(--ok); }
  header .dot.off{ background:var(--bad); }
  /* "Listen" toggle: hidden until the service actually sends audio, so a
     text-only service shows no dead control. Tapping it is also the gesture
     mobile browsers require before any sound may play. */
  header .listen{ margin-left:auto; display:none; align-items:center; gap:.4rem;
                  border:1px solid var(--accent); color:var(--accent);
                  background:transparent; font:inherit; font-size:.9rem; font-weight:600;
                  padding:.32rem .7rem; border-radius:999px; cursor:pointer;
                  -webkit-tap-highlight-color:transparent; }
  header .listen.show{ display:inline-flex; }
  header .listen.on{ background:var(--accent); color:#fff; }
  header .listen .ic{ font-size:.95em; line-height:1; }
  /* Scrolling caption river: newest at the bottom, like subtitles. */
  main{ flex:1 1 auto; overflow-y:auto; padding:1rem 1.1rem 2rem;
        padding-bottom:calc(2rem + env(safe-area-inset-bottom));
        display:flex; flex-direction:column; justify-content:flex-end;
        scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }
  #river{ display:flex; flex-direction:column; gap:.55rem; }
  .seg{ font-size:clamp(1.35rem, 4.6vw, 2.1rem); line-height:1.45;
        color:var(--dim); transition:color .4s, opacity .4s; opacity:.9;
        overflow-wrap:anywhere; }
  .seg.live{ color:var(--live); opacity:1; }          /* the sentence in progress */
  .seg.fresh{ animation:fade .45s ease-out; }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
  #empty{ margin:auto; color:var(--dim); font-size:1.05rem; text-align:center;
          padding:2rem 1rem; }
  @media (prefers-reduced-motion: reduce){
    main{ scroll-behavior:auto; } .seg.fresh{ animation:none; }
  }
</style>
</head>
<body>
  <header>
    <span class="name" id="chName">Live Translation</span>
    <button class="listen" id="listen" type="button" aria-pressed="false"
            title="Hear the translated voice, live">
      <span class="ic">🔊</span><span id="listenTxt">Listen</span>
    </button>
    <span class="dot" id="conn" title="connection"></span>
  </header>
  <main id="scroller">
    <div id="empty">Waiting for the service to begin…</div>
    <div id="river" hidden></div>
  </main>
<script>
// ---- viewer -----------------------------------------------------------------
// Polls feed.php ~1x/second and renders the caption river. State is a Map keyed
// by segment id, so an edit (re-published under the same id) updates in place and
// never duplicates. An epoch change (the operator pressed Clear) resets the
// screen. Everything here is read-only; the page holds no secrets.
const CHURCH_NAME = 'Live Translation';   // <-- change to your church's name

const scroller = document.getElementById('scroller');
const river    = document.getElementById('river');
const emptyEl  = document.getElementById('empty');
const connDot  = document.getElementById('conn');
document.getElementById('chName').textContent = CHURCH_NAME;
document.title = CHURCH_NAME;

const segs = new Map();     // id -> {el, text, done, audio}
let rev = -1, epoch = null;
let firstPaint = true;

// ---- spoken audio (optional) ------------------------------------------------
// The service may also stream the translated VOICE: each finished sentence with
// a clip is flagged audio:true in the feed, and its mp3 lives at
// clips/<epoch>/<id>.mp3. Playback starts only after the viewer taps Listen —
// the gesture mobile browsers require before any sound — and from that point new
// sentences play in order, a beat behind their caption. Whatever is already on
// screen when Listen is tapped is treated as heard, so you join the service live
// rather than from its beginning.
const listenBtn = document.getElementById('listen');
const listenTxt = document.getElementById('listenTxt');
let listening = false;
let audioSeen = false;      // has this service produced any audio at all?
const heard = new Set();    // segment ids already queued/played
const clipQ = [];           // pending clip URLs, in order
let player = null;          // the single reused <audio>
let playing = false;

function clipURL(id){ return 'clips/' + epoch + '/' + encodeURIComponent(id) + '.mp3'; }
function ensurePlayer(){
  if(player) return player;
  player = new Audio();
  const next = () => { playing = false; pumpAudio(); };
  player.addEventListener('ended', next);
  player.addEventListener('error', next);   // a missing/partial clip: skip, keep going
  return player;
}
function pumpAudio(){
  if(playing || !listening) return;
  const url = clipQ.shift();
  if(!url) return;
  playing = true;
  ensurePlayer().src = url;
  player.play().catch(() => { playing = false; });   // gesture lost — stay silent
}
function queueClip(id){
  if(heard.has(id)) return;
  heard.add(id);
  clipQ.push(clipURL(id));
  pumpAudio();
}
function stopAudio(){
  clipQ.length = 0; playing = false;
  if(player){ try{ player.pause(); }catch(e){} player.removeAttribute('src'); }
}
// Per segment, every render: reveal Listen once a service has any audio, and
// (while listening) queue each finished clip we haven't heard yet.
function noteAudio(x){
  if(!x.audio) return;
  if(!audioSeen){ audioSeen = true; listenBtn.classList.add('show'); }
  if(listening && x.done) queueClip(x.id);
}
listenBtn.addEventListener('click', () => {
  listening = !listening;
  listenBtn.classList.toggle('on', listening);
  listenBtn.setAttribute('aria-pressed', listening ? 'true' : 'false');
  listenTxt.textContent = listening ? 'Listening' : 'Listen';
  if(listening){
    // Join live: mark everything already on screen as heard, prime the element
    // inside this tap so the browser unlocks audio, then play only what's next.
    for(const [id, s] of segs){ if(s.audio && s.done) heard.add(id); }
    ensurePlayer();
  }else{
    stopAudio();
  }
});

function nearBottom(){
  return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
}
function toBottom(){ scroller.scrollTop = scroller.scrollHeight; }

function reset(){
  segs.clear(); river.textContent = ''; river.hidden = true; emptyEl.hidden = false;
  stopAudio(); heard.clear();   // a new service (Clear pressed): drop the old queue
}
function render(list){
  if(list.length && emptyEl.hidden === false){ emptyEl.hidden = true; river.hidden = false; }
  const stick = nearBottom();
  // Mark none live until we re-flag the last not-done below.
  for(const [id, s] of segs){
    const incoming = list.find(x => x.id === id);
    if(!incoming){ s.el.remove(); segs.delete(id); }
  }
  list.forEach((x, i) => {
    let s = segs.get(x.id);
    if(!s){
      const el = document.createElement('div');
      el.className = 'seg' + (firstPaint ? '' : ' fresh');
      el.textContent = x.text;
      river.appendChild(el);
      s = {el, text:x.text, done:!!x.done, audio:!!x.audio};
      segs.set(x.id, s);
    }else if(s.text !== x.text){          // an edit landed
      s.el.textContent = x.text; s.text = x.text;
    }
    s.done = !!x.done;
    s.audio = s.audio || !!x.audio;       // the clip may arrive a beat after the text
    s.el.classList.toggle('live', !x.done);
    noteAudio(x);                         // reveal Listen / queue the clip
  });
  firstPaint = false;
  if(stick) toBottom();
}

let timer = null, backoff = 1000;
async function poll(){
  try{
    const r = await fetch('feed.php?since=' + rev, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    connDot.className = 'dot on';
    backoff = 1000;
    if(d.epoch !== epoch){ epoch = d.epoch; reset(); rev = -1; }   // Clear pressed
    if(d.changed){ rev = d.rev; render(d.segs || []); }
  }catch(e){
    connDot.className = 'dot off';
    backoff = Math.min(backoff * 1.6, 8000);
  }finally{
    timer = setTimeout(poll, backoff);
  }
}
// Pause polling while the tab is hidden (phone locked / app backgrounded); resume
// immediately when it returns so the reader is never looking at stale text.
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ clearTimeout(timer); }
  else if(!document.hidden){ clearTimeout(timer); poll(); }
});
poll();
</script>
</body>
</html>
